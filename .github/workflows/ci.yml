name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # i18n 회귀 방지 — 키 대칭성 + 로케일에 없는 키 + 하드코딩 한글
      - run: npm run check:i18n
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbitail
          POSTGRES_PASSWORD: orbitail
          POSTGRES_DB: orbitail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbitail"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-only-not-a-real-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      POSTGRES_USER: orbitail
      POSTGRES_PASSWORD: orbitail
      POSTGRES_DB: orbitail
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py test --parallel 4

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # i18n 회귀 방지 — 키 대칭성 + 로케일에 없는 키 + 하드코딩 한글
      - run: npm run check:i18n
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbitail
          POSTGRES_PASSWORD: orbitail
          POSTGRES_DB: orbitail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbitail"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-only-not-a-real-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      POSTGRES_USER: orbitail
      POSTGRES_PASSWORD: orbitail
      POSTGRES_DB: orbitail
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      # 코드의 번역 문장이 .po 에 빠짐없이 들어 있는지 — 다시 추출해 커밋된 파일과 비교한다.
      # (생성 시각 줄은 매번 바뀌므로 무시)
      - name: check translation catalog is up to date
        run: |
          python manage.py makemessages -l ko -i "staticfiles/*" -i "mediafiles/*" \
            -i "*/migrations/*" -i "*/management/*" -i "*/tests*" --no-location --no-obsolete --no-wrap
          git diff --exit-code -I 'POT-Creation-Date' -- locale/ || {
            echo "::error::코드에 새 번역 문장이 있습니다. makemessages 후 locale/ko 에 한국어를 채워 커밋하세요."; exit 1; }
      - run: python manage.py compilemessages
      - run: python manage.py test --parallel 4

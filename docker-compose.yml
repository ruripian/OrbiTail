services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbitail}
      POSTGRES_USER: ${POSTGRES_USER:-orbitail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbitail}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbitail}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 오토리로드용 watchfiles 설치 (운영 빌드에는 들어가지 않는다)
        INSTALL_DEV: 1
    # migrate는 entrypoint.sh에서 실행 — command에서 중복 제거
    # watchfiles 로 감싼 이유: daphne 에는 오토리로드가 없다. Django runserver 로
    # 바꾸면 리로드는 되지만 ASGI/WebSocket(Channels)이 죽어서 문서 협업·실시간
    # 알림을 개발에서 못 쓴다. 프로세스를 통째로 재시작하는 방식이라 둘 다 산다.
    command: watchfiles --filter python --target-type command "daphne -b 0.0.0.0 -p 8000 config.asgi:application" /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: 1
    command: watchfiles --filter python --target-type command "celery -A config.celery worker -l info" /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      # 마이그레이션은 backend 컨테이너만 적용한다. 여기서는 적용이
      # 끝날 때까지 기다렸다 시작한다 (backend/entrypoint.sh 참고).
      - RUN_MIGRATIONS=0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: 1
    command: watchfiles --filter python --target-type command "celery -A config.celery beat -l info" /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      # 마이그레이션은 backend 컨테이너만 적용한다. 여기서는 적용이
      # 끝날 때까지 기다렸다 시작한다 (backend/entrypoint.sh 참고).
      - RUN_MIGRATIONS=0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 실시간 협업 서버 — Yjs 문서를 들고 있으면서 **문서 구조를 이해한다**.
  # frontend 이미지를 그대로 쓴다: 스키마 파일과 TipTap 을 프론트와 한 벌로 공유해야
  # 서버가 만드는 HTML 이 브라우저가 만드는 것과 어긋나지 않는다.
  collab:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -c "npm install && npm run collab"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - COLLAB_API_BASE=http://backend:8000/api
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend
      - collab

volumes:
  postgres_data:
  redis_data:

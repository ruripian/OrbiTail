services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "orbitail-backend:${TAG:-local}"
    pull_policy: never
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - db
      - redis
    restart: always
    # 헬스체크 — 포트 수신만 확인 (/api/setup/status/ 는 AllowAny 라 인증 없이 200)
    # nginx depends_on: service_healthy 와 결합해 리빌드 시 502 최소화
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8000)); s.close()' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  celery:
    image: "orbitail-backend:${TAG:-local}"
    pull_policy: never
    command: celery -A config.celery worker -l info --concurrency 4
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      # 마이그레이션은 backend 컨테이너만 적용한다. 여기서는 적용이
      # 끝날 때까지 기다렸다 시작한다 (backend/entrypoint.sh 참고).
      - RUN_MIGRATIONS=0
    depends_on:
      - db
      - redis
    restart: always

  celery-beat:
    image: "orbitail-backend:${TAG:-local}"
    pull_policy: never
    command: celery -A config.celery beat -l info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      # 마이그레이션은 backend 컨테이너만 적용한다. 여기서는 적용이
      # 끝날 때까지 기다렸다 시작한다 (backend/entrypoint.sh 참고).
      - RUN_MIGRATIONS=0
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOW_SPONSOR: ${VITE_SHOW_SPONSOR:-true}
        VITE_MAX_UPLOAD_SIZE_MB: ${VITE_MAX_UPLOAD_SIZE_MB:-10}
    image: "orbitail-frontend:${TAG:-local}"
    pull_policy: never
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # 실시간 협업 서버 — 문서 구조를 아는 쪽. 내부 전용이라 포트를 바깥에 열지 않는다
  # (nginx 의 /collab 경로로만 닿는다).
  collab:
    build:
      context: ./frontend
      dockerfile: Dockerfile.collab
    image: "orbitail-collab:${TAG:-local}"
    pull_policy: never
    env_file:
      - .env
    environment:
      - COLLAB_API_BASE=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: ./nginx
    image: "orbitail-nginx:${TAG:-local}"
    pull_policy: never
    # 포트 바인딩 — .env로 환경별 커스터마이징
    #  단독 서버(직접 노출): HOST_BIND_ADDR=0.0.0.0, HOST_HTTP_PORT=80, HOST_HTTPS_PORT=443
    #  호스트 nginx 뒤에 둘 때: HOST_BIND_ADDR=127.0.0.1, HOST_HTTP_PORT=8080 (HTTPS는 호스트에서 종단)
    ports:
      - "${HOST_BIND_ADDR:-0.0.0.0}:${HOST_HTTP_PORT:-80}:80"
      - "${HOST_BIND_ADDR:-0.0.0.0}:${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - certbot_conf:/etc/letsencrypt        # SSL 인증서
      - certbot_www:/var/www/certbot          # ACME 챌린지
    environment:
      - DOMAIN=${DOMAIN:-}                    # HTTPS 모드일 때 server_name·인증서 경로
      # auto = DOMAIN 있으면 HTTPS / off = 항상 HTTP (앞단에서 TLS 종단)
      - NGINX_TLS=${NGINX_TLS:-auto}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
    # restart: true — backend/frontend 컨테이너가 recreate 되면 nginx 도 자동 재시작
    # (upstream 컨테이너 IP 변경으로 발생하는 502 Bad Gateway 방지)
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true
      collab:
        condition: service_started
        restart: true
    restart: always

  # --- Let's Encrypt 인증서 자동 발급/갱신 ---
  # DOMAIN이 설정된 경우에만 동작 (비어있으면 즉시 종료)
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # 12시간마다 갱신 시도 (만료 30일 전에만 실제 갱신됨)
    # NGINX_TLS=off 면 인증서는 앞단이 맡으므로 여기서 갱신하지 않는다.
    entrypoint: /bin/sh -c "if [ -z '${DOMAIN:-}' ] || [ '${NGINX_TLS:-auto}' = 'off' ]; then echo '[certbot] TLS 를 여기서 종단하지 않음 — 건너뜀'; exit 0; fi; trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200; done"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  certbot_conf:
  certbot_www:
